pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

rootProject.name = 'dokit-maven-consumer'

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        // DoKit artifacts must come from this migration run, never from remote
        // Maven, a project dependency or an included-build substitution.
        exclusiveContent {
            forRepository {
                maven {
                    name = 'migration'
                    url = uri(providers.gradleProperty('migrationRepository').get())
                }
            }
            filter { includeGroup(providers.gradleProperty('migrationGroup').getOrElse('io.github.qqnp1100')) }
        }
        google()
        mavenCentral()
    }
}
