buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.4.1'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.4.21'
    }
}

apply plugin: 'com.android.application'

android {
    namespace 'com.didichuxing.dokit.migration.consumer'
    // AGP 9.4.1's ViewBinding/DataBinding artifacts require compileSdk >= 34.
    compileSdk 34
    defaultConfig {
        applicationId 'com.didichuxing.dokit.migration.consumer'
        minSdk 21
        targetSdk 31
        versionCode 1
        versionName '1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildTypes {
        release {
            // This isolated test APK may be installed on a verification device.
            signingConfig signingConfigs.debug
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    lint {
        // A private migration host intentionally verifies the preserved target
        // SDK contract; it is not submitted to Google Play.
        disable += ['ExpiredTargetSdkVersion']
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8
    }
}

def migrationGroup = providers.gradleProperty('migrationGroup').getOrElse('io.github.qqnp1100')
def migrationVersion = providers.gradleProperty('migrationVersion').getOrElse('3.7.14')
dependencies {
    implementation "${migrationGroup}:dokitx-no-op:${migrationVersion}"
    implementation "${migrationGroup}:dokitx-util:${migrationVersion}"
}
