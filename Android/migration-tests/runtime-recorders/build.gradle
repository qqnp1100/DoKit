plugins {
    id 'org.jetbrains.kotlin.jvm' version '2.4.21'
}

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8
    }
    sourceSets {
        main {
            kotlin {
                setSrcDirs(['../../dokit/src/main/java'])
                include 'com/didichuxing/doraemonkit/aop/InvocationTracker.kt'
                include 'com/didichuxing/doraemonkit/aop/method_stack/MethodStackRecorder.kt'
                include 'com/didichuxing/doraemonkit/aop/method_stack/MethodInvokNode.kt'
            }
        }
        test {
            kotlin {
                setSrcDirs(['../../dokit/src/test/java'])
                include 'com/didichuxing/doraemonkit/aop/InvocationTrackerTest.kt'
                include 'com/didichuxing/doraemonkit/aop/method_stack/MethodStackRecorderTest.kt'
            }
        }
    }
}

dependencies {
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.4.21'
    testImplementation 'junit:junit:4.13.2'
}

tasks.named('test', Test) {
    useJUnit()
    testLogging { events 'passed', 'failed', 'skipped' }
}
