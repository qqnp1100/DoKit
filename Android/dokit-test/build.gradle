apply plugin: 'com.android.library'
apply plugin: 'com.android.legacy-kapt'
apply from: '../upload.gradle'

android {
    namespace 'com.didichuxing.doraemonkit.test'
    compileSdk rootProject.ext.android["compileSdkVersion"]

    defaultConfig {
        minSdk rootProject.ext.android["minSdkVersion_21"]
        consumerProguardFiles rootProject.file('gradle/consumer-rules/slf4j.pro'),
            rootProject.file('gradle/consumer-rules/epic.pro')
    }

    buildTypes {
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
    }


    /**
     * 支持ViewBinding
     */
    buildFeatures {
        //viewBinding = true
    }

}


kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8
    }
}


dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'junit:junit:4.12'
    compileOnly rootProject.ext.dependencies["kotlin"]
    implementation rootProject.ext.dependencies["core-ktx"]
    implementation rootProject.ext.dependencies["fragment-ktx"]
    implementation rootProject.ext.dependencies["appcompat"]
    implementation rootProject.ext.dependencies["cardview"]
    implementation rootProject.ext.dependencies["recyclerview"]
    implementation rootProject.ext.dependencies["fragment"]
    implementation rootProject.ext.dependencies["zxing"]

    implementation rootProject.ext.dependencies["epic"]

//    implementation rootProject.ext.dependencies["sandhook_hooklib"]
//    implementation rootProject.ext.dependencies["sandhook_nativehook"]
//    implementation rootProject.ext.dependencies["sandhook_xposedcompat"]

    implementation rootProject.ext.dependencies["volley"]
    implementation rootProject.ext.dependencies["ktor_server_websockets"]
    implementation rootProject.ext.dependencies["ktor_client_websockets"]
    implementation rootProject.ext.dependencies["ktor_server_cio"]
    //默认客户端websocket引擎
    implementation rootProject.ext.dependencies["ktor_client_cio"]
    //备用客户端websocket引擎
    compileOnly rootProject.ext.dependencies["ktor_client_okhttp"]
    compileOnly project(':dokit-util')
    compileOnly project(':dokit-okhttp-api')
    //此处需要使用api的形式 向上暴露内部api
    implementation project(':dokit')
    //okhttp wrap
    //auto-service
    implementation rootProject.ext.dependencies["auto_service"]
    kapt rootProject.ext.dependencies["auto_service"]
}
repositories {
    mavenCentral()
}
