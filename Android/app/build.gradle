plugins {
    id 'com.android.application'
    id 'com.android.legacy-kapt'
    id 'com.didi.dokit'
}
apply from: 'doraemonkit.gradle'
//apply plugin: 'com.didiglobal.booster'

android {
    namespace 'com.didichuxing.doraemondemo'
    compileSdkVersion rootProject.ext.android["compileSdkVersion"]
    defaultConfig {
        applicationId providers.gradleProperty('DOKIT_MIGRATION_APPLICATION_ID')
            .getOrElse(rootProject.ext.android["applicationId"])
        minSdkVersion rootProject.ext.android["minSdkVersion_21"]
        targetSdkVersion rootProject.ext.android["targetSdkVersion"]
        versionCode rootProject.ext.android["versionCode"]
        versionName rootProject.ext.android["versionName"]
        ndk {
            abiFilters "arm64-v8a"
        }
        multiDexEnabled true
    }
    signingConfigs {
        release {
            storeFile file("keystore/test.keystore")
            storePassword "test123456"
            keyAlias "test"
            keyPassword "test123456"
        }
    }
    buildTypes {
        debug {
            manifestPlaceholders['BAIDU_MAP_API_KEY'] = providers.gradleProperty('BAIDU_MAP_API_KEY')
                .orElse(providers.environmentVariable('BAIDU_MAP_API_KEY')).getOrElse('')
            resValue("string", "dokit_db_Person.db", "a_password")
            debuggable true
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
//            debuggable true
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
//    flavorDimensions "default"
//    productFlavors {
//        product0 {
//            applicationId "com.didichuxing.doraemondemo0"
////            resValue "string", "app_name", "DoKitDemo0"
////            manifestPlaceholders = [CHANNEL_VALUE: "product0"
////                                    , app_icon   : "@mipmap/logo"]
//        }
//        product1 {
//            applicationId "com.didichuxing.doraemondemo1"
////            resValue "string", "app_name", "DoKitDemo1"
////            manifestPlaceholders = [CHANNEL_VALUE: "product1"
////                                    , app_icon   : "@mipmap/logo"]
//        }
//    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    //指定资源和代码目录
    sourceSets {
        debug {
            manifest.srcFile 'src/debug/java/AndroidManifest.xml'
        }

        release {
            manifest.srcFile 'src/release/java/AndroidManifest.xml'
        }
    }


    lint {
        abortOnError false
    }

    /**
     * 支持ViewBinding
     */
    buildFeatures {
        viewBinding = true
        resValues = true
    }


    packaging {
        resources {
            // AutoService providers from every enabled extension must survive.
            merges += ['META-INF/services/*']
        }
        jniLibs {
            // MergeNativeLibs runs before the APK ABI filter; exclude unsupported
            // Demo ABIs here as well so their unused C++ runtimes do not collide.
            excludes += ['**/armeabi/**', '**/armeabi-v7a/**', '**/x86/**', '**/x86_64/**']
            // Weex/Matrix share this entry. Preserve Weex's existing r18b copy
            // (59aa4cc...) and assert the APK hash + imported-symbol union via
            // scripts/verify-native-cpp-runtime.py; see gradle/native-cpp-providers.json.
            pickFirsts += ['lib/arm64-v8a/libc++_shared.so']
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8
    }
}


//dokit 扩展


dokit {
    gpsEnable true
    bigImageEnable true
    webView {
        network true
        dokitWeb true
        vConsole true
    }
    gps {
        didi true
        baidu true
    }
}

