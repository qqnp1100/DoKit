// The plugin is resolved by the included build through app's plugins block.
def runType = rootProject.ext.publish_config['run_type']
def modules = new groovy.json.JsonSlurper().parse(rootProject.file('dokit_module.json'))
def debugModules = ['dokit', 'dokit-mc', 'dokit-ft', 'dokit-gps-mock',
                    'dokit-autotest', 'dokit-test', 'dokit-pthread-hook']
dependencies {
    debugModules.each { module ->
        if (runType == 0) {
            add('debugImplementation', project(":${module}"))
        } else {
            add('debugImplementation', "${rootProject.group}:${modules[module]}:${rootProject.version}")
        }
    }
    if (runType == 0) {
        releaseImplementation project(':dokit-no-op')
    } else {
        releaseImplementation "${rootProject.group}:${modules['dokit-no-op']}:${rootProject.version}"
    }
}
