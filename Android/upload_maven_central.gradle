import org.gradle.api.publish.maven.tasks.PublishToMavenRepository

// No default is retained for the retired OSSRH transport. Select a supported
// Maven-compatible Central Publisher Portal deployment transport explicitly.
apply plugin: 'signing'

def centralUrl = dokitPublicationSetting('DOKIT_PUBLISH_URL')
def centralUsername = dokitPublicationSetting('DOKIT_PUBLISH_USERNAME') ?: dokitPublicationSetting('MAVEN_CENTRAL_USERNAME')
def centralPassword = dokitPublicationSetting('DOKIT_PUBLISH_PASSWORD') ?: dokitPublicationSetting('MAVEN_CENTRAL_PASSWORD')
def signingKey = dokitPublicationSetting('DOKIT_SIGNING_KEY')
def signingPassword = dokitPublicationSetting('DOKIT_SIGNING_PASSWORD') ?: dokitPublicationSetting('signing.password')
def signingKeyId = dokitPublicationSetting('signing.keyId')
def signingKeyRing = dokitPublicationSetting('signing.secretKeyRingFile')
def hasSigningKey = signingKey || (signingKeyId && signingKeyRing)

if (signingKeyId && signingKeyRing) {
    ext['signing.keyId'] = signingKeyId
    ext['signing.password'] = signingPassword
    ext['signing.secretKeyRingFile'] = signingKeyRing
}
signing {
    required = false
    if (signingKey) {
        useInMemoryPgpKeys(signingKey, signingPassword)
    }
    if (hasSigningKey) {
        sign publishing.publications
    }
}

publishing {
    repositories {
        maven {
            name = 'central'
            url = centralUrl ?: rootProject.layout.buildDirectory.dir('unconfigured-central-repository').get().asFile.toURI()
            if (centralUsername && centralPassword) {
                credentials {
                    username = centralUsername
                    password = centralPassword
                }
            }
        }
    }
}

tasks.withType(PublishToMavenRepository).configureEach {
    doFirst {
        if (repository.name == 'central') {
            if (!centralUrl) {
                throw new GradleException('Central publication requires explicit DOKIT_PUBLISH_URL for a supported Central Publisher Portal deployment transport. No OSSRH endpoint is used. Local validation uses publishReleasePublicationToMigrationRepository.')
            }
            if (centralUrl.contains('oss.sonatype.org')) {
                throw new GradleException('The OSSRH destination is retired. Set DOKIT_PUBLISH_URL to the intended Central publishing transport.')
            }
            if (!hasSigningKey) {
                throw new GradleException('Central publication requires DOKIT_SIGNING_KEY and DOKIT_SIGNING_PASSWORD, or the signing.keyId/password/secretKeyRingFile settings.')
            }
        }
    }
}
