apply plugin: 'com.android.library'
apply from: '../upload.gradle'

android {
    namespace 'com.didichuxing.doraemonkit'
    compileSdk rootProject.ext.android["compileSdkVersion"]

    defaultConfig {
        minSdk rootProject.ext.android["minSdkVersion_16"]

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

    }

    buildTypes {
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
    }

}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8
    }
}


dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    // Public no-op view/fragment APIs expose AndroidX types to consumers.
    api rootProject.ext.dependencies["fragment"]
    api rootProject.ext.dependencies["annotation"]
    //compileOnly rootProject.ext.dependencies["okio"]
    compileOnly rootProject.ext.dependencies["kotlin"]
    compileOnly rootProject.ext.dependencies["okhttp_v3"]
    //三大图片框架
    compileOnly rootProject.ext.dependencies["glide"]
    compileOnly rootProject.ext.dependencies["picasso"]
    compileOnly rootProject.ext.dependencies["fresco"]
    // The no-op bridge only exposes HummerContext from hummer-sdk in its
    // signature. Hummer's optional UI/native runtime is supplied by the host.
    compileOnly('io.github.didi.hummer:hummer-sdk:0.3.23') {
        transitive = false
    }
}
repositories {
    mavenCentral()
}
