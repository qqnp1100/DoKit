apply plugin: 'com.android.library'
apply plugin: 'com.android.legacy-kapt'
apply from: '../upload.gradle'

android {
    namespace 'com.didichuxing.doraemonkit.ft'
    compileSdk rootProject.ext.android["compileSdkVersion"]

    defaultConfig {
        minSdk rootProject.ext.android["minSdkVersion_16"]
        consumerProguardFiles rootProject.file('gradle/consumer-rules/slf4j.pro')

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

    }

    buildTypes {
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
    }

    /**
     * 支持ViewBinding
     */
    buildFeatures {
        //viewBinding = true
    }
}


kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8
    }
}


dependencies {
    testImplementation rootProject.ext.dependencies["junit"]
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    compileOnly rootProject.ext.dependencies["kotlin"]
    implementation rootProject.ext.dependencies["appcompat"]
    implementation rootProject.ext.dependencies["activity-ktx"]
    //sql
    implementation rootProject.ext.dependencies["wcdb"]
//    implementation rootProject.ext.dependencies["core-ktx"]
    implementation rootProject.ext.dependencies["auto_service"]
    kapt rootProject.ext.dependencies["auto_service"]
    //ktor
    implementation rootProject.ext.dependencies["ktor_server_core"]
    implementation rootProject.ext.dependencies["ktor_server_cio"]

    //此处需要使用api的形式 向上暴露内部api
    implementation project(':dokit')
    compileOnly project(':dokit-util')
}
repositories {
    mavenCentral()
}
