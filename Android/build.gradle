// Kotlin is supplied to AGP's built-in Kotlin support; Android modules do not
// apply org.jetbrains.kotlin.android. The standalone plugin uses Kotlin JVM.
buildscript {
    apply from: 'config.gradle'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:${rootProject.ext.android['agp_version']}"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${rootProject.ext.android['kotlin_version']}"
    }
}

plugins {
    id 'com.android.legacy-kapt' version '9.4.1' apply false
}

apply from: 'config.gradle'

allprojects {
    group = rootProject.ext.publish_config['group_id']
    version = rootProject.ext.publish_config['version']
    repositories {
        google()
        mavenCentral()
        if (rootProject.usePrivateEnv()) {
            maven { url = uri(rootProject.privateRepository()) }
        }
        if (rootProject.useLocalRepository()) {
            maven { url = uri(rootProject.localRepository()) }
        }
    }
    apply from: rootProject.file('legacy-repositories.gradle')
    pluginManager.withPlugin('com.android.legacy-kapt') {
        apply from: rootProject.file('gradle/kapt-services.gradle')
    }
}

tasks.register('clean', Delete) {
    delete layout.buildDirectory
}

// Existing release scripts retain these entry points. Plugin publications now
// live in the independent included build and are invoked with -p dokit-plugin.
['Local': 0, 'Didi': 1, 'Maven': 2].each { name, mode ->
    tasks.register("checkUploadConfig4${name}") {
        doLast {
            if (rootProject.ext.publish_config['archives_type'] != mode) {
                throw new GradleException("Set archives_type=${mode} before using this upload entry point")
            }
        }
    }
}
