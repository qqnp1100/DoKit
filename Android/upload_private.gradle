import org.gradle.api.publish.maven.tasks.PublishToMavenRepository

// Optional credentials and local.properties do not affect ordinary assemble.
def privateUrl = dokitPublicationSetting('DOKIT_PUBLISH_URL')
if (!privateUrl) {
    privateUrl = (version.toString().endsWith('-SNAPSHOT')
        ? dokitPublicationSetting('DIDI_SNAPSHOT_REPOSITORY_URL')
        : dokitPublicationSetting('DIDI_REPOSITORY_URL'))
    privateUrl = privateUrl ?: dokitPublicationSetting('DIDI_REPOSITORY_URL')
}
def privateUsername = dokitPublicationSetting('DOKIT_PUBLISH_USERNAME') ?: dokitPublicationSetting('DIDI_USERNAME')
def privatePassword = dokitPublicationSetting('DOKIT_PUBLISH_PASSWORD') ?: dokitPublicationSetting('DIDI_PASSWORD')

publishing {
    repositories {
        maven {
            name = 'private'
            // Missing destinations leave inspectable tasks with an explicit
            // execution failure before writing to this placeholder.
            url = privateUrl ?: rootProject.layout.buildDirectory.dir('unconfigured-private-repository').get().asFile.toURI()
            if (privateUsername && privatePassword) {
                credentials {
                    username = privateUsername
                    password = privatePassword
                }
            }
        }
    }
}

tasks.withType(PublishToMavenRepository).configureEach {
    doFirst {
        if (repository.name == 'private') {
            if (!privateUrl) {
                throw new GradleException('Private publication requires DOKIT_PUBLISH_URL or DIDI_REPOSITORY_URL (Gradle property, environment or optional local.properties).')
            }
        }
    }
}
